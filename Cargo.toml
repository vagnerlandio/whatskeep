[workspace]
resolver = "3"
members = ["crates/wk-crypt", "crates/wk-import", "crates/wk-vault", "crates/wk-gdrive", "crates/wk-export", "apps/desktop/src-tauri"]

[workspace.dependencies]
# SQLCipher across the whole workspace: rusqlite does not accept "plain" SQLite
# and SQLCipher in the same build, and the vault needs SQLCipher.
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl", "serialize"] }
# Diagnostics. With no subscriber installed (libraries, tests), it costs nothing.
tracing = "0.1"

[workspace.package]
edition = "2024"
license = "UNLICENSED"

# Profiles only apply at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decrypting large backups is far too slow without optimization, even in
# tests.
[profile.dev.package."*"]
opt-level = 2
