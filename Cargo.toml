[workspace]
resolver = "3"
members = ["crates/wa-crypt", "crates/wa-import", "crates/wa-vault", "apps/desktop/src-tauri"]

[workspace.dependencies]
# SQLCipher em todo o workspace: o rusqlite não aceita SQLite "comum" e
# SQLCipher no mesmo build, e o cofre precisa do SQLCipher.
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl", "serialize"] }

[workspace.package]
edition = "2024"
license = "UNLICENSED"

# Perfis só valem na raiz do workspace.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# A descriptografia de backups grandes fica lenta demais sem otimização,
# mesmo nos testes.
[profile.dev.package."*"]
opt-level = 2
