[package]
name = "wk-export"
version = "0.1.0"
description = "Generates the chat history as offline HTML, password-encrypted (opens in any browser)"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
hkdf = "0.12"
rusqlite = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
wk-vault = { path = "../wk-vault" }
zeroize = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
wk-import = { path = "../wk-import" }
