[package]
name = "wa-crypt"
version = "0.1.0"
description = "Decryption of WhatsApp backups (.crypt14 / .crypt15)"
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
ghash = "0.5"
flate2 = "1"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["std"] }
