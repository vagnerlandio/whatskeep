[package]
name = "wk-import"
version = "0.1.0"
description = "Reads the WhatsApp msgstore.db (legacy and modern schemas) and writes it to the app's normalized schema"
edition.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
rusqlite = { workspace = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wk-crypt = { path = "../wk-crypt" }
