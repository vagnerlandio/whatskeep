[package]
name = "wa-historico"
version = "0.1.0"
description = "Histórico offline de backups do WhatsApp"
edition.workspace = true
license.workspace = true

[lib]
# O sufixo `_lib` evita conflito entre os nomes da lib e do binário no Windows.
name = "wa_historico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wa-crypt = { path = "../../../crates/wa-crypt" }
wa-import = { path = "../../../crates/wa-import" }
wa-vault = { path = "../../../crates/wa-vault" }
wa-gdrive = { path = "../../../crates/wa-gdrive" }
wa-export = { path = "../../../crates/wa-export" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "smallvec", "tracing-log"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
zeroize = { version = "1", features = ["std"] }
base64 = "0.22"
rusqlite = { workspace = true }
