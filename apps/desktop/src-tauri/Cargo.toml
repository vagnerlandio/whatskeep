[package]
name = "whatskeep"
version = "0.1.0"
description = "WhatsKeep: Your WhatsApp conversations, safe and accessible."
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and the binary on Windows.
name = "whatskeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is named like the app: macOS shows the executable name in
# the Dock when the app runs outside a bundle (`pnpm dev`).
[[bin]]
name = "WhatsKeep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wk-crypt = { path = "../../../crates/wk-crypt" }
wk-import = { path = "../../../crates/wk-import" }
wk-vault = { path = "../../../crates/wk-vault" }
wk-gdrive = { path = "../../../crates/wk-gdrive" }
wk-export = { path = "../../../crates/wk-export" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "smallvec", "tracing-log"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
zeroize = { version = "1", features = ["std"] }
base64 = "0.22"
rusqlite = { workspace = true }
