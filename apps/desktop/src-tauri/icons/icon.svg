<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- WhatsKeep app icon. Regenerate: pnpm tauri icon src-tauri/icons/icon.svg (in apps/desktop) -->
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D39B"/>
      <stop offset="0.55" stop-color="#14A37F"/>
      <stop offset="1" stop-color="#0A6553"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="170" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="330" x2="0" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F6EF"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="430" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14A37F"/>
      <stop offset="1" stop-color="#0A5E4D"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.26"/>
    </filter>
    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03362B" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Tile (macOS grid: 824x824 centred, transparent margin) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- Back bubble: the conversation history -->
  <rect x="372" y="214" width="420" height="320" rx="104" fill="#FFFFFF" fill-opacity="0.32"/>

  <!-- Front bubble -->
  <g filter="url(#bubble-shadow)" fill="url(#paper)">
    <rect x="232" y="330" width="500" height="380" rx="120"/>
    <path d="M300 640 C304 726 286 776 250 814 C338 812 412 772 458 700 Z"/>
  </g>

  <!-- Keyhole -->
  <g fill="url(#hole)">
    <circle cx="482" cy="488" r="58"/>
    <path d="M456 516 L508 516 L523 600 Q526 618 508 618 L456 618 Q438 618 441 600 Z"/>
  </g>
</svg>
